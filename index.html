1<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitor de estabilidad inteligente para foro iFastNet - Detecta caídas y resoluciones automáticamente">
    <meta name="theme-color" content="#0b0f1a">
    <title>Monitor de Estabilidad | YODA</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300d4a8'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%230b0f1a' font-family='Arial'%3EY%3C/text%3E%3C/svg%3E">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yoda-bg:      #0b0f1a;
            --yoda-surface: #121828;
            --yoda-border:  #1e2d45;
            --yoda-accent:  #00d4a8;
            --yoda-accent2: #0077ff;
            --yoda-warn:    #f5a623;
            --yoda-danger:  #e84040;
            --yoda-text:    #c8d6e5;
            --yoda-muted:   #5a7184;
            --radius:       10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--yoda-bg);
            color: var(--yoda-text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
        }

        .monitor-wrap {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .monitor-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .monitor-title {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yoda-accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .monitor-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .monitor-heading span {
            color: var(--yoda-accent);
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid;
            white-space: nowrap;
            transition: all .3s;
        }

        .status-pill.loading {
            border-color: var(--yoda-muted);
            color: var(--yoda-muted);
        }

        .status-pill.ok {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .status-pill.warn {
            border-color: var(--yoda-warn);
            color: var(--yoda-warn);
        }

        .status-pill.error {
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-dot.pulse {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: .4; transform: scale(.7); }
        }

        /* Alert banner */
        .alert-banner {
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        .alert-banner.critical {
            background: rgba(232, 64, 64, 0.12);
            border: 1px solid var(--yoda-danger);
            color: var(--yoda-danger);
        }

        .alert-banner.resolved {
            background: rgba(0, 212, 168, 0.12);
            border: 1px solid var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .alert-banner.info {
            background: rgba(0, 119, 255, 0.08);
            border: 1px solid var(--yoda-accent2);
            color: var(--yoda-accent2);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Card principal */
        .monitor-card {
            background: var(--yoda-surface);
            border: 1px solid var(--yoda-border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .monitor-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .source-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--yoda-muted);
        }

        .source-label strong {
            color: var(--yoda-text);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Botón refresh */
        .btn-refresh {
            background: none;
            border: 1px solid var(--yoda-border);
            color: var(--yoda-muted);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .2s;
        }

        .btn-refresh:hover:not(:disabled) {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .btn-refresh:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-refresh svg {
            width: 13px;
            height: 13px;
            transition: transform .4s;
        }

        .btn-refresh.spinning svg {
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toggle sonido */
        .btn-toggle {
            background: none;
            border: 1px solid var(--yoda-border);
            color: var(--yoda-muted);
            border-radius: 6px;
            padding: 5px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all .2s;
        }

        .btn-toggle:hover {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .btn-toggle.active {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
            background: rgba(0, 212, 168, 0.08);
        }

        /* Estado vacío / cargando */
        .state-box {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--yoda-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .state-box .spinner-mono {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--yoda-border);
            border-top-color: var(--yoda-accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin-bottom: 0.75rem;
        }

        /* Lista de items */
        .feed-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .feed-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem 1rem;
            align-items: start;
            transition: background .15s;
            animation: slideIn .3s ease both;
            position: relative;
        }

        .feed-item:last-child { border-bottom: none; }

        .feed-item:hover { background: rgba(255,255,255,.025); }

        .feed-item.critical { border-left: 3px solid var(--yoda-danger); padding-left: calc(1.25rem - 3px); }
        .feed-item.resolved { border-left: 3px solid var(--yoda-accent); padding-left: calc(1.25rem - 3px); }
        .feed-item.warning  { border-left: 3px solid var(--yoda-warn);  padding-left: calc(1.25rem - 3px); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .feed-item:nth-child(1) { animation-delay: .05s; }
        .feed-item:nth-child(2) { animation-delay: .10s; }
        .feed-item:nth-child(3) { animation-delay: .15s; }
        .feed-item:nth-child(4) { animation-delay: .20s; }
        .feed-item:nth-child(5) { animation-delay: .25s; }

        .feed-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 0.3rem;
        }

        .feed-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .feed-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .feed-badge.critical { background: rgba(232, 64, 64, 0.15); color: var(--yoda-danger); }
        .feed-badge.resolved { background: rgba(0, 212, 168, 0.15); color: var(--yoda-accent); }
        .feed-badge.warning  { background: rgba(245, 166, 35, 0.15); color: var(--yoda-warn); }

        .btn-ver {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-accent2);
            border: 1px solid var(--yoda-accent2);
            border-radius: 5px;
            padding: 4px 10px;
            text-decoration: none;
            white-space: nowrap;
            transition: all .2s;
            margin-top: 2px;
        }

        .btn-ver:hover {
            background: var(--yoda-accent2);
            color: #fff;
        }

        /* Alert integrado */
        .inline-alert {
            margin: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.77rem;
            border-left: 3px solid;
        }

        .inline-alert.warn {
            background: rgba(245, 166, 35, 0.08);
            border-color: var(--yoda-warn);
            color: var(--yoda-warn);
        }

        .inline-alert.danger {
            background: rgba(232, 64, 64, 0.08);
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        /* Footer card */
        .monitor-card-footer {
            padding: 0.65rem 1.25rem;
            border-top: 1px solid var(--yoda-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .last-update {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .counter-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .next-check {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        /* Historial */
        .history-section {
            margin-top: 1.5rem;
        }

        .history-title {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yoda-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }

        .history-list {
            list-style: none;
            padding: 0;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            border-bottom: 1px solid var(--yoda-border);
            color: var(--yoda-text);
        }

        .history-item:last-child { border-bottom: none; }

        .history-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .history-dot.critical { background: var(--yoda-danger); }
        .history-dot.resolved { background: var(--yoda-accent); }
        .history-dot.warning  { background: var(--yoda-warn); }

        .history-time {
            color: var(--yoda-muted);
            white-space: nowrap;
        }

        /* Config */
        .config-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
        }

        .config-row label {
            color: var(--yoda-muted);
            min-width: 140px;
        }

        .config-row input[type="number"] {
            background: var(--yoda-bg);
            border: 1px solid var(--yoda-border);
            color: var(--yoda-text);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            width: 80px;
        }

        .config-row input[type="text"] {
            background: var(--yoda-bg);
            border: 1px solid var(--yoda-border);
            color: var(--yoda-text);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 576px) {
            body { padding: 1rem 0.75rem; }
            .monitor-heading { font-size: 1.3rem; }
            .monitor-header { flex-direction: column; align-items: flex-start; }
            .feed-item { grid-template-columns: 1fr; gap: 0.75rem; }
            .btn-ver { align-self: flex-start; }
            .monitor-card-header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; justify-content: space-between; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--yoda-accent);
            color: var(--yoda-bg);
            padding: 8px;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 100;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus { top: 0; }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Saltar al contenido</a>

<div class="monitor-wrap" role="main" id="main-content" aria-label="Monitor de estabilidad">

    <!-- Encabezado -->
    <div class="monitor-header">
        <div>
            <div class="monitor-title">// sistema de monitoreo inteligente</div>
            <h1 class="monitor-heading">Foro <span>iFastNet</span></h1>
        </div>
        <div id="statusPill" class="status-pill loading" role="status" aria-live="polite" aria-atomic="true">
            <span class="status-dot pulse" aria-hidden="true"></span>
            <span id="statusText">Consultando...</span>
        </div>
    </div>

    <!-- Banner de alerta dinámico -->
    <div id="alertBanner" style="display:none;"></div>

    <!-- Card principal -->
    <div class="monitor-card" role="region" aria-label="Feed de reportes">

        <div class="monitor-card-header">
            <div class="source-label">
                fuente: <strong>forum.infinityfree.com/posts.rss</strong>
            </div>
            <div class="controls">
                <button class="btn-toggle" id="btnSound" aria-label="Activar/desactivar sonido" title="Sonido de alertas">
                    🔇 Silencio
                </button>
                <button class="btn-refresh" id="btnRefresh" aria-label="Recargar feed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    Recargar
                </button>
            </div>
        </div>

        <div id="feedBody" role="feed" aria-busy="true" aria-label="Lista de reportes">
            <div class="state-box">
                <div class="spinner-mono" aria-hidden="true"></div><br>
                Consultando foro...
            </div>
        </div>

        <div class="monitor-card-footer">
            <span class="last-update" id="lastUpdate">—</span>
            <span class="counter-label" id="itemCounter" aria-live="polite"></span>
            <span class="next-check" id="nextCheck"></span>
        </div>
    </div>

    <!-- Configuración -->
    <div class="monitor-card">
        <div class="monitor-card-header">
            <div class="source-label"><strong>⚙️ Configuración</strong></div>
        </div>
        <div class="config-row">
            <label for="intervalInput">Intervalo (seg):</label>
            <input type="number" id="intervalInput" value="60" min="10" max="3600">
        </div>
        <div class="config-row">
            <label for="keywordsDown">Palabras caída:</label>
            <input type="text" id="keywordsDown" value="down,not working,offline,error,500,502,503,404,stuck,broken,fail,can't access,unable,problem,issue">
        </div>
        <div class="config-row">
            <label for="keywordsUp">Palabras resuelto:</label>
            <input type="text" id="keywordsUp" value="fixed,resolved,working,back,online,restored,solved,ok,fine,stable,up and running,recovered">
                </div>
