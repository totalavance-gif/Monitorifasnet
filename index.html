<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Estabilidad | YODA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yoda-bg:      #0b0f1a;
            --yoda-surface: #121828;
            --yoda-border:  #1e2d45;
            --yoda-accent:  #00d4a8;
            --yoda-accent2: #0077ff;
            --yoda-warn:    #f5a623;
            --yoda-danger:  #e84040;
            --yoda-text:    #c8d6e5;
            --yoda-muted:   #5a7184;
            --radius:       10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--yoda-bg);
            color: var(--yoda-text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Ruido de fondo sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
        }

        .monitor-wrap {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
        }

        /* Header */
        .monitor-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .monitor-title {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yoda-accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .monitor-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .monitor-heading span {
            color: var(--yoda-accent);
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid;
            white-space: nowrap;
            transition: all .3s;
        }

        .status-pill.loading {
            border-color: var(--yoda-muted);
            color: var(--yoda-muted);
        }

        .status-pill.ok {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .status-pill.error {
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-dot.pulse {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: .4; transform: scale(.7); }
        }

        /* Card principal */
        .monitor-card {
            background: var(--yoda-surface);
            border: 1px solid var(--yoda-border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .monitor-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            gap: 1rem;
        }

        .source-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--yoda-muted);
        }

        .source-label strong {
            color: var(--yoda-text);
        }

        /* Botón refresh */
        .btn-refresh {
            background: none;
            border: 1px solid var(--yoda-border);
            color: var(--yoda-muted);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .2s;
        }

        .btn-refresh:hover:not(:disabled) {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .btn-refresh:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-refresh svg {
            width: 13px;
            height: 13px;
            transition: transform .4s;
        }

        .btn-refresh.spinning svg {
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Estado vacío / cargando */
        .state-box {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--yoda-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .state-box .spinner-mono {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--yoda-border);
            border-top-color: var(--yoda-accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin-bottom: 0.75rem;
        }

        /* Lista de items */
        .feed-list {
            list-style: none;
        }

        .feed-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem 1rem;
            align-items: start;
            transition: background .15s;
            animation: slideIn .3s ease both;
        }

        .feed-item:last-child { border-bottom: none; }

        .feed-item:hover { background: rgba(255,255,255,.025); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .feed-item:nth-child(1) { animation-delay: .05s; }
        .feed-item:nth-child(2) { animation-delay: .10s; }
        .feed-item:nth-child(3) { animation-delay: .15s; }
        .feed-item:nth-child(4) { animation-delay: .20s; }
        .feed-item:nth-child(5) { animation-delay: .25s; }

        .feed-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 0.3rem;
        }

        .feed-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .btn-ver {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-accent2);
            border: 1px solid var(--yoda-accent2);
            border-radius: 5px;
            padding: 4px 10px;
            text-decoration: none;
            white-space: nowrap;
            transition: all .2s;
            margin-top: 2px;
        }

        .btn-ver:hover {
            background: var(--yoda-accent2);
            color: #fff;
        }

        /* Alert integrado */
        .inline-alert {
            margin: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.77rem;
            border-left: 3px solid;
        }

        .inline-alert.warn {
            background: rgba(245, 166, 35, 0.08);
            border-color: var(--yoda-warn);
            color: var(--yoda-warn);
        }

        .inline-alert.danger {
            background: rgba(232, 64, 64, 0.08);
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        /* Footer card */
        .monitor-card-footer {
            padding: 0.65rem 1.25rem;
            border-top: 1px solid var(--yoda-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .last-update {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .counter-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }
    </style>
</head>
<body>

<div class="monitor-wrap">

    <!-- Encabezado -->
    <div class="monitor-header">
        <div>
            <div class="monitor-title">// sistema de monitoreo</div>
            <h1 class="monitor-heading">Foro <span>iFastNet</span></h1>
        </div>
        <div id="statusPill" class="status-pill loading">
            <span class="status-dot pulse"></span>
            <span id="statusText">Consultando...</span>
        </div>
    </div>

    <!-- Card principal -->
    <div class="monitor-card">

        <div class="monitor-card-header">
            <div class="source-label">
                fuente: <strong>forum.infinityfree.com/posts.rss</strong>
            </div>
            <button class="btn-refresh" id="btnRefresh" onclick="cargarFeed()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
                Recargar
            </button>
        </div>

        <div id="feedBody">
            <div class="state-box">
                <div class="spinner-mono"></div><br>
                Consultando foro...
            </div>
        </div>

        <div class="monitor-card-footer">
            <span class="last-update" id="lastUpdate">—</span>
            <span class="counter-label" id="itemCounter"></span>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script>
const RSS_URL   = "https://forum.infinityfree.com/posts.rss";
const PROXY     = "https://api.allorigins.win/get?url=";
const TIMEOUT   = 10000; // 10 segundos máximo de espera
const MAX_ITEMS = 5;

// Sanitiza un string para insertarlo como texto visible (evita XSS)
function sanitize(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// Formatea fecha legible
function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const d = new Date(dateStr);
        return d.toLocaleString('es-MX', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    } catch(e) { return dateStr; }
}

// Establece el estado del indicador superior
function setStatus(state, label) {
    const pill = $('#statusPill');
    const dot  = pill.find('.status-dot');
    pill.removeClass('loading ok error').addClass(state);
    dot.toggleClass('pulse', state === 'loading');
    $('#statusText').text(label);
}

// Activa / desactiva el botón de refresh
function setBtnState(loading) {
    const btn = $('#btnRefresh');
    btn.prop('disabled', loading).toggleClass('spinning', loading);
}

function cargarFeed() {
    setBtnState(true);
    setStatus('loading', 'Consultando...');
    $('#feedBody').html(`
        <div class="state-box">
            <div class="spinner-mono"></div><br>
            Conectando con el foro...
        </div>`);
    $('#itemCounter').text('');

    // Se añade timestamp para evitar caché del proxy
    const url = PROXY + encodeURIComponent(RSS_URL + '?_=' + Date.now());

    $.ajax({
        url:      url,
        dataType: 'json',
        timeout:  TIMEOUT
    })
    .done(function(data) {
        try {
            if (!data || !data.contents) throw new Error('Respuesta vacía del proxy.');

            const xml   = $.parseXML(data.contents);
            const $xml  = $(xml);
            const items = $xml.find('item');

            if (items.length === 0) {
                setStatus('ok', 'Sin reportes nuevos');
                $('#feedBody').html('<div class="inline-alert warn">No hay reportes nuevos en el foro.</div>');
                return;
            }

            let html = '<ul class="feed-list">';
            let count = 0;

            items.slice(0, MAX_ITEMS).each(function() {
                const titulo = $(this).find('title').text() || 'Sin título';

                // <link> en RSS 2.0 es un nodo de texto siguiente al tag <link>
                // jQuery no lo lee bien con .find("link"), se usa el nodo de texto hermano
                let link = '';
                const linkNode = $(this).find('link');
                if (linkNode.length) {
                    // Intento 1: nodo de texto siguiente (RSS estándar)
                    const next = linkNode[0].nextSibling;
                    if (next && next.nodeType === 3) {
                        link = next.nodeValue.trim();
                    }
                    // Intento 2: atributo href (Atom híbrido)
                    if (!link) link = linkNode.attr('href') || '';
                    // Intento 3: texto del nodo
                    if (!link) link = linkNode.text().trim();
                }

                const fecha  = $(this).find('pubDate').text();
                const safe_t = sanitize(titulo);
                const safe_l = sanitize(link);

                html += `
                <li class="feed-item">
                    <div>
                        <div class="feed-title">${safe_t}</div>
                        <div class="feed-date">${formatDate(fecha)}</div>
                    </div>
                    ${safe_l ? `<a href="${safe_l}" target="_blank" rel="noopener noreferrer" class="btn-ver">
                        Ver
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>` : ''}
                </li>`;
                count++;
            });

            html += '</ul>';
            $('#feedBody').html(html);
            setStatus('ok', 'Activo');
            $('#itemCounter').text(`${count} de ${items.length} reportes`);

        } catch(e) {
            setStatus('error', 'Error de parseo');
            $('#feedBody').html(`<div class="inline-alert danger">
                Error al procesar los datos del foro: ${sanitize(e.message)}
            </div>`);
        }
    })
    .fail(function(jqXHR, textStatus) {
        const msg = textStatus === 'timeout'
            ? 'Tiempo de espera agotado (>10 s). Verifica tu conexión.'
            : 'No se pudo conectar con el foro. Intenta recargar más tarde.';
        setStatus('error', 'Sin conexión');
        $('#feedBody').html(`<div class="inline-alert warn">${msg}</div>`);
    })
    .always(function() {
        setBtnState(false);
        const now = new Date().toLocaleString('es-MX', {
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        $('#lastUpdate').text('Última consulta: ' + now);
    });
}

// Carga inicial
$(document).ready(function() {
    cargarFeed();
});
</script>
</body>
</html>
