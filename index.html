<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitor de estabilidad para foro iFastNet - Sistema de monitoreo YODA">
    <meta name="theme-color" content="#0b0f1a">
    <title>Monitor de Estabilidad | YODA</title>

    <!-- Favicon inline SVG para evitar peticiones externas -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300d4a8'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%230b0f1a' font-family='Arial'%3EY%3C/text%3E%3C/svg%3E">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yoda-bg:      #0b0f1a;
            --yoda-surface: #121828;
            --yoda-border:  #1e2d45;
            --yoda-accent:  #00d4a8;
            --yoda-accent2: #0077ff;
            --yoda-warn:    #f5a623;
            --yoda-danger:  #e84040;
            --yoda-text:    #c8d6e5;
            --yoda-muted:   #5a7184;
            --radius:       10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--yoda-bg);
            color: var(--yoda-text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Ruido de fondo sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
        }

        .monitor-wrap {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
        }

        /* Header */
        .monitor-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .monitor-title {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--yoda-accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .monitor-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .monitor-heading span {
            color: var(--yoda-accent);
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid;
            white-space: nowrap;
            transition: all .3s;
        }

        .status-pill.loading {
            border-color: var(--yoda-muted);
            color: var(--yoda-muted);
        }

        .status-pill.ok {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .status-pill.error {
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-dot.pulse {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: .4; transform: scale(.7); }
        }

        /* Card principal */
        .monitor-card {
            background: var(--yoda-surface);
            border: 1px solid var(--yoda-border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .monitor-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            gap: 1rem;
        }

        .source-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--yoda-muted);
        }

        .source-label strong {
            color: var(--yoda-text);
        }

        /* Botón refresh */
        .btn-refresh {
            background: none;
            border: 1px solid var(--yoda-border);
            color: var(--yoda-muted);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .2s;
        }

        .btn-refresh:hover:not(:disabled) {
            border-color: var(--yoda-accent);
            color: var(--yoda-accent);
        }

        .btn-refresh:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-refresh svg {
            width: 13px;
            height: 13px;
            transition: transform .4s;
        }

        .btn-refresh.spinning svg {
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Estado vacío / cargando */
        .state-box {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--yoda-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .state-box .spinner-mono {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--yoda-border);
            border-top-color: var(--yoda-accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin-bottom: 0.75rem;
        }

        /* Lista de items */
        .feed-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .feed-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--yoda-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem 1rem;
            align-items: start;
            transition: background .15s;
            animation: slideIn .3s ease both;
        }

        .feed-item:last-child { border-bottom: none; }

        .feed-item:hover { background: rgba(255,255,255,.025); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .feed-item:nth-child(1) { animation-delay: .05s; }
        .feed-item:nth-child(2) { animation-delay: .10s; }
        .feed-item:nth-child(3) { animation-delay: .15s; }
        .feed-item:nth-child(4) { animation-delay: .20s; }
        .feed-item:nth-child(5) { animation-delay: .25s; }

        .feed-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 0.3rem;
        }

        .feed-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .btn-ver {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-accent2);
            border: 1px solid var(--yoda-accent2);
            border-radius: 5px;
            padding: 4px 10px;
            text-decoration: none;
            white-space: nowrap;
            transition: all .2s;
            margin-top: 2px;
        }

        .btn-ver:hover {
            background: var(--yoda-accent2);
            color: #fff;
        }

        /* Alert integrado */
        .inline-alert {
            margin: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.77rem;
            border-left: 3px solid;
        }

        .inline-alert.warn {
            background: rgba(245, 166, 35, 0.08);
            border-color: var(--yoda-warn);
            color: var(--yoda-warn);
        }

        .inline-alert.danger {
            background: rgba(232, 64, 64, 0.08);
            border-color: var(--yoda-danger);
            color: var(--yoda-danger);
        }

        /* Footer card */
        .monitor-card-footer {
            padding: 0.65rem 1.25rem;
            border-top: 1px solid var(--yoda-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .last-update {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        .counter-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--yoda-muted);
        }

        /* Responsive */
        @media (max-width: 576px) {
            body { padding: 1rem 0.75rem; }
            .monitor-heading { font-size: 1.3rem; }
            .monitor-header { flex-direction: column; align-items: flex-start; }
            .feed-item { grid-template-columns: 1fr; gap: 0.75rem; }
            .btn-ver { align-self: flex-start; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--yoda-accent);
            color: var(--yoda-bg);
            padding: 8px;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 100;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus { top: 0; }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Saltar al contenido</a>

<div class="monitor-wrap" role="main" id="main-content" aria-label="Monitor de estabilidad">

    <!-- Encabezado -->
    <div class="monitor-header">
        <div>
            <div class="monitor-title">// sistema de monitoreo</div>
            <h1 class="monitor-heading">Foro <span>iFastNet</span></h1>
        </div>
        <div id="statusPill" class="status-pill loading" role="status" aria-live="polite" aria-atomic="true">
            <span class="status-dot pulse" aria-hidden="true"></span>
            <span id="statusText">Consultando...</span>
        </div>
    </div>

    <!-- Card principal -->
    <div class="monitor-card" role="region" aria-label="Feed de reportes">

        <div class="monitor-card-header">
            <div class="source-label">
                fuente: <strong>forum.infinityfree.com/posts.rss</strong>
            </div>
            <button class="btn-refresh" id="btnRefresh" aria-label="Recargar feed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M23 4v6h-6M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
                Recargar
            </button>
        </div>

        <div id="feedBody" role="feed" aria-busy="true" aria-label="Lista de reportes">
            <div class="state-box">
                <div class="spinner-mono" aria-hidden="true"></div><br>
                Consultando foro...
            </div>
        </div>

        <div class="monitor-card-footer">
            <span class="last-update" id="lastUpdate">—</span>
            <span class="counter-label" id="itemCounter" aria-live="polite"></span>
        </div>

    </div>
</div>

<script>
// ============================================
// CONFIGURACIÓN
// ============================================
const CONFIG = {
    RSS_URL:   "https://forum.infinityfree.com/posts.rss",
    MAX_ITEMS: 5,
    TIMEOUT:   12000,
    RETRY_DELAY: 1000
};

// Proxies en orden de preferencia
const PROXIES = [
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

// ============================================
// UTILIDADES
// ============================================

/**
 * Sanitiza un string para inserción segura como texto visible
 * @param {string} str - Texto a sanitizar
 * @returns {string} Texto escapado
 */
function sanitize(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

/**
 * Formatea una fecha a formato legible en español
 * @param {string} dateStr - Fecha ISO o similar
 * @returns {string} Fecha formateada
 */
function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleString('es-MX', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    } catch(e) { 
        return dateStr; 
    }
}

/**
 * Establece el estado del indicador superior
 * @param {string} state - 'loading' | 'ok' | 'error'
 * @param {string} label - Texto descriptivo
 */
function setStatus(state, label) {
    const pill = document.getElementById('statusPill');
    const dot  = pill.querySelector('.status-dot');
    const text = document.getElementById('statusText');

    pill.className = `status-pill ${state}`;
    dot.classList.toggle('pulse', state === 'loading');
    text.textContent = label;
}

/**
 * Activa/desactiva el botón de refresh
 * @param {boolean} loading - Estado de carga
 */
function setBtnState(loading) {
    const btn = document.getElementById('btnRefresh');
    btn.disabled = loading;
    btn.classList.toggle('spinning', loading);
    btn.setAttribute('aria-busy', loading ? 'true' : 'false');
}

/**
 * Muestra mensaje de carga con proxy actual
 * @param {number} index - Índice del proxy
 */
function setLoadingMsg(index) {
    const feedBody = document.getElementById('feedBody');
    feedBody.innerHTML = `
        <div class="state-box">
            <div class="spinner-mono" aria-hidden="true"></div><br>
            Intentando proxy ${index + 1} de ${PROXIES.length}...
        </div>`;
    feedBody.setAttribute('aria-busy', 'true');
}

// ============================================
// PARSEO RSS
// ============================================

/**
 * Parsea XML RSS y genera HTML de la lista
 * @param {string} xmlStr - String XML del RSS
 * @returns {Object|null} { html, count, total } o null si no hay items
 */
function parsearRSS(xmlStr) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlStr, "text/xml");

    // Verificar errores de parseo
    const parseError = xmlDoc.querySelector("parsererror");
    if (parseError) {
        console.warn("Error parseando XML:", parseError.textContent);
        return null;
    }

    const items = xmlDoc.querySelectorAll('item');
    if (items.length === 0) return null;

    let html  = '<ul class="feed-list">';
    let count = 0;

    items.forEach((item, idx) => {
        if (idx >= CONFIG.MAX_ITEMS) return;

        const titulo = item.querySelector('title')?.textContent?.trim() || 'Sin título';

        // Extraer link: RSS 2.0 usa nodo de texto adyacente
        let link = '';
        const linkNode = item.querySelector('link');
        if (linkNode) {
            // Intentar href (Atom)
            link = linkNode.getAttribute('href') || '';
            // Intentar texto del nodo
            if (!link) link = linkNode.textContent?.trim() || '';
            // Intentar nextSibling (RSS 2.0)
            if (!link && linkNode.nextSibling?.nodeType === 3) {
                link = linkNode.nextSibling.nodeValue?.trim() || '';
            }
        }

        const fecha = item.querySelector('pubDate')?.textContent || '';
        const safe_t = sanitize(titulo);
        const safe_l = sanitize(link);

        html += `
        <li class="feed-item">
            <div>
                <div class="feed-title">${safe_t}</div>
                <div class="feed-date">${formatDate(fecha)}</div>
            </div>
            ${safe_l ? `<a href="${safe_l}" target="_blank" rel="noopener noreferrer" class="btn-ver">
                Ver
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </a>` : ''}
        </li>`;
        count++;
    });

    html += '</ul>';
    return { html, count, total: items.length };
}

// ============================================
// FETCH CON PROXIES (Vanilla JS)
// ============================================

/**
 * Realiza fetch con timeout
 * @param {string} url - URL a fetch
 * @param {number} timeout - Tiempo máximo en ms
 * @returns {Promise<Response>}
 */
function fetchWithTimeout(url, timeout = CONFIG.TIMEOUT) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);

    return fetch(url, { signal: controller.signal })
        .finally(() => clearTimeout(id));
}

/**
 * Intenta cada proxy en secuencia
 * @param {number} proxyIndex - Índice del proxy a intentar
 * @returns {Promise<Object>} Resultado del parseo
 */
async function intentarProxies(proxyIndex = 0) {
    if (proxyIndex >= PROXIES.length) {
        throw new Error('all_failed');
    }

    setLoadingMsg(proxyIndex);
    setStatus('loading', `Proxy ${proxyIndex + 1}/${PROXIES.length}...`);

    const rssConCache = CONFIG.RSS_URL + '?_=' + Date.now();
    const proxyUrl = PROXIES[proxyIndex](rssConCache);

    try {
        const response = await fetchWithTimeout(proxyUrl);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        let raw = await response.text();

        // Algunos proxies devuelven JSON con .contents
        try {
            const json = JSON.parse(raw);
            if (json && typeof json.contents === 'string') {
                raw = json.contents;
            }
        } catch(e) {
            // No es JSON, usar raw directamente
        }

        if (!raw || raw.trim() === '') {
            throw new Error('Respuesta vacía');
        }

        const resultado = parsearRSS(raw);
        if (!resultado) {
            throw new Error('Sin items en RSS');
        }

        return resultado;

    } catch (error) {
        console.warn(
