<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Estabilidad | YODA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Estado del Foro (iFastNet)</h4>
            </div>
            <div class="card-body">
                <div id="msjMonitoreo">
                    <div class="spinner-border text-primary" role="status"></div>
                    <span>Consultando foro...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const rssUrl = "https://forum.infinityfree.com/posts.rss";
            // Usamos un servicio de proxy alternativo para asegurar la carga
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(rssUrl);

            $.getJSON(proxy)
                .done(function(data) {
                    try {
                        const xml = $.parseXML(data.contents);
                        const $xml = $(xml);
                        let html = '<ul class="list-group list-group-flush">';
                        
                        let items = $xml.find("item");
                        if (items.length === 0) {
                            $('#msjMonitoreo').html('<div class="alert alert-info">No hay reportes nuevos.</div>');
                            return;
                        }

                        items.slice(0, 5).each(function() {
                            let titulo = $(this).find("title").text();
                            let link = $(this).find("link").text();
                            html += `<li class="list-group-item">
                                        <strong>${titulo}</strong><br>
                                        <a href="${link}" target="_blank" class="btn btn-sm btn-outline-primary mt-1">Ver reporte</a>
                                     </li>`;
                        });
                        
                        html += '</ul>';
                        $('#msjMonitoreo').html(html);
                    } catch (e) {
                        $('#msjMonitoreo').html('<div class="alert alert-danger">Error al procesar los datos.</div>');
                    }
                })
                .fail(function() {
                    $('#msjMonitoreo').html('<div class="alert alert-warning">No se pudo conectar con el foro. Por favor, intenta recargar más tarde.</div>');
                });
        });
    </script>
</body>
</html>
