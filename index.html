<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Estabilidad | YODA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white"><h4>Estado del Foro (iFastNet)</h4></div>
            <div class="card-body">
                <div id="msjMonitoreo">Analizando...</div>
            </div>
        </div>
    </div>

    <script>
        // Usamos un servicio proxy para evitar problemas de CORS al leer el RSS
        const rssUrl = "https://forum.infinityfree.com/posts.rss";
        const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(rssUrl);

        $.getJSON(proxy, function(data) {
            const xml = $($.parseXML(data.contents));
            let html = '<ul class="list-group">';
            xml.find("item").slice(0, 5).each(function() {
                let titulo = $(this).find("title").text();
                let link = $(this).find("link").text();
                html += `<li class="list-group-item"><strong>${titulo}</strong><br><a href="${link}" target="_blank">Ver reporte</a></li>`;
            });
            $('#msjMonitoreo').html(html + '</ul>');
        }).fail(() => $('#msjMonitoreo').html('Error al conectar con el foro.'));
    </script>
</body>
  </html>
